name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    # Write access only so a version tag can publish its release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build the app and the disk image
        run: ./scripts/build.sh --dmg

      # The MCP server is the part chat clients depend on, so check it answers before shipping.
      - name: Check that the MCP server answers
        run: |
          reply=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | build/Auxilius.app/Contents/MacOS/Auxilius --mcp)
          echo "$reply"
          echo "$reply" | grep -q '"read_paper"'

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Auxilius
          path: build/Auxilius.dmg

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Auxilius.dmg --title "Auxilius $GITHUB_REF_NAME" --generate-notes
